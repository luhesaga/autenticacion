server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: "autenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  r2dbc:
    host: ${ADAPTERS_R2DBC_HOST:crediya-database.c8xu0yg4cj9m.us-east-1.rds.amazonaws.com}
    port: 5432
    database: ${ADAPTERS_R2DBC_DATABASE:autenticacion_db}
    schema: public
    username: ${ADAPTERS_R2DBC_USERNAME:postgres}
    password: ${ADAPTERS_R2DBC_PASSWORD:App$2025}
    ssl: true
    ssl-mode: require
    pool:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
    co.com.crediya.autenticacion: TRACE
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql: DEBUG
app:
  default-admin:
    email: admin@crediya.com
    password: AdminPassword123
    name: Administrador
    lastname: del Sistema
    documentId: 1111111
    rolId: 1
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
jwt:
  secret: ${JWT_SECRET:EsteEsUnSecretoSuperLargoYComplejoParaMiAplicacionCrediYaNoCompartir}
  expiration:
    ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas
